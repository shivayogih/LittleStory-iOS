name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rules (dependencies, hardcoding, translations, tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 Tools/check-dependencies.py
      - run: python3 Tools/check-hardcoding.py
      - run: python3 Tools/check-translations.py
      - run: python3 Tools/check-tokens.py

  build-and-test:
    name: Lint, build and test (iPhone + iPad)
    # GitHub's GA macOS images (macos-26) stop at Xcode 26.6; Xcode 27 is only on the
    # xcode-27 preview image so far. Switch to the GA label once it carries Xcode 27.
    runs-on: xcode-27
    # The iPhone and iPad UI tests run one after the other (see below), so allow for both.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode from .xcode-version (newest 27.x if 27.2 is not on the image)
        run: Tools/select-xcode.sh

      - name: Install pinned SwiftLint and SwiftFormat
        run: Tools/install-lint-tools.sh

      - name: SwiftFormat
        run: .tools/bin/swiftformat --lint .

      - name: SwiftLint
        run: .tools/bin/swiftlint lint --strict --reporter github-actions-logging

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Pick simulators
        id: sims
        run: |
          echo "iphone=$(python3 Tools/pick-simulator.py iphone)" >> "$GITHUB_OUTPUT"
          echo "ipad=$(python3 Tools/pick-simulator.py ipad)" >> "$GITHUB_OUTPUT"

      # Booting before xcodebuild avoids "test runner hung before establishing connection"
      # on a cold simulator.
      - name: Boot simulators
        run: |
          for destination in "${{ steps.sims.outputs.iphone }}" "${{ steps.sims.outputs.ipad }}"; do
            udid="${destination#id=}"
            # simctl boot fails when the device is already booted, which is fine here.
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
          done

      - name: Package tests (Swift Testing)
        working-directory: Packages/LittleStoryKit
        run: >
          xcodebuild test
          -scheme LittleStoryKit-Package
          -destination "${{ steps.sims.outputs.iphone }}"
          -resultBundlePath "$RUNNER_TEMP/PackageTests.xcresult"
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 120
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: App build and UI tests on iPhone and iPad
        run: >
          xcodebuild test
          -project LittleStory.xcodeproj
          -scheme LittleStory
          -destination "${{ steps.sims.outputs.iphone }}"
          -destination "${{ steps.sims.outputs.ipad }}"
          -disable-concurrent-destination-testing
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 300
          -resultBundlePath "$RUNNER_TEMP/AppTests.xcresult"
          CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
