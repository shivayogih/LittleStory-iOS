# SwiftLint 0.65.1 (Tools/versions.env). Run with --strict in CI: warnings fail the build.
included:
  - App
  - Packages/LittleStoryKit/Sources
  - Packages/LittleStoryKit/Tests
excluded:
  - App/Generated
  - Packages/LittleStoryKit/.build
disabled_rules:
  - trailing_comma        # SwiftFormat owns trailing commas
  - opening_brace         # SwiftFormat owns brace wrapping
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - sorted_first_last
  - modifier_order
  - private_swiftui_state
  - accessibility_label_for_image
identifier_name:
  min_length: 2
  excluded: [id, x, y]
type_name:
  min_length: 2
line_length:
  warning: 140
  error: 160
  ignores_comments: true
  ignores_urls: true
custom_rules:
  no_print:
    name: "No print"
    regex: '^\s*(?:debug)?[Pp]rint\('
    message: "Use os.Logger, never print"
    severity: error
